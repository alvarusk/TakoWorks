name: ci-release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  ARTIFACT_NAME: "TakoWorks_win64.zip"
  BUILD_DIR: "dist/TakoWorks"

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run tests
        run: pytest -q

  build-windows:
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install build dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pyinstaller

      - name: Check spec exists
        shell: pwsh
        run: |
          Write-Host "Workspace: $Env:GITHUB_WORKSPACE"
          Get-ChildItem -Path $Env:GITHUB_WORKSPACE -Filter "*.spec" -Recurse
          $spec = Join-Path $Env:GITHUB_WORKSPACE "TakoWorks.spec"
          if (-not (Test-Path $spec)) { throw "TakoWorks.spec not found at $spec" }

      - name: Build executable (PyInstaller)
        shell: pwsh
        run: |
          $spec = Join-Path $Env:GITHUB_WORKSPACE "TakoWorks.spec"
          pyinstaller --clean $spec

      - name: Package artifact (zip)
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.BUILD_DIR }}")) { throw "Build dir not found at ${{ env.BUILD_DIR }}." }
          Compress-Archive -Path "${{ env.BUILD_DIR }}\\*" -DestinationPath "${{ env.ARTIFACT_NAME }}" -Force

      - name: Set MSIX version from __version__
        shell: pwsh
        run: |
          $init = Join-Path $Env:GITHUB_WORKSPACE "src/takoworks/__init__.py"
          $verLine = Get-Content $init | Where-Object { $_ -match '__version__' } | Select-Object -First 1
          if (-not $verLine) { throw "__version__ not found in $init" }
          if ($verLine -notmatch '"([^"]+)"') { throw "Could not parse version from $verLine" }
          $ver = $Matches[1]
          Write-Host "Parsed __version__: $ver"
          $manifest = Join-Path $Env:GITHUB_WORKSPACE "dist_installer/AppxManifest.xml"
          if (-not (Test-Path $manifest)) { throw "AppxManifest.xml not found at $manifest" }
          $xml = [xml](Get-Content $manifest)
          $xml.Package.Identity.Version = "$ver.0"
          $xml.Save($manifest)
          $xmlCheck = [xml](Get-Content $manifest)
          $finalVer = $xmlCheck.Package.Identity.Version
          Write-Host "Set AppxManifest version to $finalVer"

      - name: Validate AppxManifest schema (makeappx)
        shell: pwsh
        run: |
          pwsh bin/validate_appxmanifest.ps1 -Manifest dist_installer/AppxManifest.xml -AssetsDir dist_installer/assets -BuildDir "${{ env.BUILD_DIR }}"

      - name: Build MSIX (makeappx)
        shell: pwsh
        run: |
          $manifest = Join-Path $Env:GITHUB_WORKSPACE "dist_installer/AppxManifest.xml"
          $assetsSrc = Join-Path $Env:GITHUB_WORKSPACE "dist_installer/assets"
          if (-not (Test-Path $manifest)) { throw "AppxManifest not found at $manifest" }
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found under Windows Kits" }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path "${{ env.BUILD_DIR }}" "AppxManifest.xml") -Force
          $buildManifest = Join-Path "${{ env.BUILD_DIR }}" "AppxManifest.xml"
          $buildXml = [xml](Get-Content $buildManifest)
          Write-Host "Build dir AppxManifest version: $($buildXml.Package.Identity.Version)"
          $dstAssets = Join-Path "${{ env.BUILD_DIR }}" "assets"
          if (-not (Test-Path $dstAssets)) { New-Item -ItemType Directory -Path $dstAssets | Out-Null }
          Copy-Item -Path (Join-Path $assetsSrc "*") -Destination $dstAssets -Recurse -Force

          function Test-AppxSafeRelativePath {
            param([string]$RelativePath)

            $norm = $RelativePath -replace '/', '\'
            if ([string]::IsNullOrWhiteSpace($norm)) {
              return [PSCustomObject]@{ IsValid = $false; Reason = "Empty relative path" }
            }
            if ($norm.StartsWith('\') -or $norm -match '^[A-Za-z]:') {
              return [PSCustomObject]@{ IsValid = $false; Reason = "Path is not package-relative" }
            }

            $segments = $norm -split '\\'
            foreach ($seg in $segments) {
              if ([string]::IsNullOrWhiteSpace($seg)) { continue }
              if ($seg -in @(".", "..")) {
                return [PSCustomObject]@{ IsValid = $false; Reason = "Dot segment not allowed: '$seg'" }
              }
              if ($seg.TrimEnd(' ', '.').Length -ne $seg.Length) {
                return [PSCustomObject]@{ IsValid = $false; Reason = "Segment ends with dot/space: '$seg'" }
              }
              if ($seg -match '^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\..*)?$') {
                return [PSCustomObject]@{ IsValid = $false; Reason = "Reserved Windows device name: '$seg'" }
              }
              if ($seg.IndexOfAny([IO.Path]::GetInvalidFileNameChars()) -ge 0) {
                return [PSCustomObject]@{ IsValid = $false; Reason = "Invalid character in segment: '$seg'" }
              }
            }
            return [PSCustomObject]@{ IsValid = $true; Reason = "" }
          }

          $buildDirResolved = (Resolve-Path -LiteralPath "${{ env.BUILD_DIR }}").Path
          $packDir = Join-Path $Env:RUNNER_TEMP "msix_pack_in"
          if (Test-Path $packDir) { Remove-Item -LiteralPath $packDir -Recurse -Force }
          New-Item -ItemType Directory -Path $packDir | Out-Null
          Copy-Item -Path (Join-Path $buildDirResolved "*") -Destination $packDir -Recurse -Force
          $packageSourceDir = (Resolve-Path -LiteralPath $packDir).Path
          Write-Host "Packaging from short staging dir: $packageSourceDir"

          $invalid = New-Object System.Collections.Generic.List[object]
          $longPaths = New-Object System.Collections.Generic.List[object]
          Get-ChildItem -LiteralPath $packageSourceDir -File -Recurse | ForEach-Object {
            $rel = [IO.Path]::GetRelativePath($packageSourceDir, $_.FullName)
            $check = Test-AppxSafeRelativePath -RelativePath $rel
            if (-not $check.IsValid) {
              $invalid.Add([PSCustomObject]@{ Path = $rel; Reason = $check.Reason }) | Out-Null
            }
            if ($_.FullName.Length -gt 240) {
              $longPaths.Add([PSCustomObject]@{ Path = $rel; Length = $_.FullName.Length }) | Out-Null
            }
          }

          if ($longPaths.Count -gt 0) {
            Write-Warning "Detected $($longPaths.Count) very long file paths (>240 chars) under build dir. makeappx can fail with opaque path syntax errors."
            $longPaths | Select-Object -First 10 | ForEach-Object {
              Write-Warning ("long-path [{0} chars] {1}" -f $_.Length, $_.Path)
            }
          }

          if ($invalid.Count -gt 0) {
            Write-Host "Invalid package paths detected before makeappx:"
            $invalid | Select-Object -First 20 | ForEach-Object {
              Write-Host (" - {0} ({1})" -f $_.Path, $_.Reason)
            }
            throw "Aborting MSIX build: found $($invalid.Count) invalid package-relative file path(s)."
          }

          $makeappxOut = Join-Path $Env:RUNNER_TEMP "makeappx.pack.out.log"
          $makeappxErr = Join-Path $Env:RUNNER_TEMP "makeappx.pack.err.log"
          if (Test-Path $makeappxOut) { Remove-Item $makeappxOut -Force }
          if (Test-Path $makeappxErr) { Remove-Item $makeappxErr -Force }

          Write-Host "Running makeappx: $($makeappx.FullName) pack /o /d $packageSourceDir /p TakoWorks.msix"
          $proc = Start-Process -FilePath $makeappx.FullName `
            -ArgumentList @("pack", "/o", "/d", $packageSourceDir, "/p", "TakoWorks.msix") `
            -RedirectStandardOutput $makeappxOut `
            -RedirectStandardError $makeappxErr `
            -PassThru -WindowStyle Hidden
          $proc.WaitForExit()

          Write-Host "---- makeappx stdout (tail 300) ----"
          if (Test-Path $makeappxOut) { Get-Content $makeappxOut -Tail 300 | Write-Host }
          Write-Host "---- makeappx stderr (tail 300) ----"
          if (Test-Path $makeappxErr) { Get-Content $makeappxErr -Tail 300 | Write-Host }

          if ($proc.ExitCode -ne 0) {
            $stdout = @()
            $stderr = @()
            if (Test-Path $makeappxOut) { $stdout = Get-Content $makeappxOut }
            if (Test-Path $makeappxErr) { $stderr = Get-Content $makeappxErr }
            $all = $stdout + $stderr
            $lastProcessing = $all | Where-Object { $_ -like 'Processing "*' } | Select-Object -Last 1
            $codeMatch = $all | Select-String -Pattern '0x[0-9A-Fa-f]{8}' | Select-Object -Last 1
            $errorCode = if ($codeMatch) { $codeMatch.Matches[0].Value } else { "<not-detected>" }
            $lastProcessingText = if ($lastProcessing) { $lastProcessing } else { "<not-found>" }

            $hint = "Review the last 'Processing ... as a payload file' line and inspect nearby file names/paths."
            if ($errorCode -ieq "0x8007007b") {
              $hint = "0x8007007B indicates invalid filename/path syntax. Check for trailing dots/spaces, reserved names (CON/AUX/NUL/COMx/LPTx), or too-long paths in dist/TakoWorks."
            }

            throw (
              @(
                "makeappx pack failed with exit code $($proc.ExitCode)."
                "Windows error code: $errorCode"
                "Last payload processed: $lastProcessingText"
                "Hint: $hint"
                "Build dir: $buildDirResolved"
                "Pack dir: $packageSourceDir"
                "Logs:"
                "  stdout: $makeappxOut"
                "  stderr: $makeappxErr"
              ) -join [Environment]::NewLine
            )
          }

      - name: Inspect MSIX version
        shell: pwsh
        run: |
          $msixPath = Join-Path $PWD "TakoWorks.msix"
          if (-not (Test-Path $msixPath)) { throw "MSIX not found: $msixPath" }
          $tmp = Join-Path $Env:RUNNER_TEMP "msix_inspect"
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          Expand-Archive -Path $msixPath -DestinationPath $tmp
          $manifest = Join-Path $tmp "AppxManifest.xml"
          if (-not (Test-Path $manifest)) { throw "AppxManifest.xml not found inside MSIX" }
          $xml = [xml](Get-Content $manifest)
          $ver = $xml.Package.Identity.Version
          Write-Host "MSIX AppxManifest version: $ver"

      - name: Sign MSIX
        shell: pwsh
        env:
          PFX_CERT: ${{ secrets.PFX_CERT }}
          PFX_PASS: ${{ secrets.PFX_PASS }}
        run: |
          if (-not $env:PFX_CERT) { throw "PFX_CERT secret not set" }
          if (-not $env:PFX_PASS) { throw "PFX_PASS secret not set" }

          $msixPath = Join-Path $PWD "TakoWorks.msix"
          if (-not (Test-Path $msixPath)) { throw "MSIX not found: $msixPath" }

          # Write PFX to temp (we sign directly from the PFX; no cert-store/root imports to avoid hangs in CI)
          $pfxPath = Join-Path $Env:RUNNER_TEMP "sig.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_CERT))

          # Find signtool.exe (latest x64 from Windows Kits)
          $kitsBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signtoolPath = Get-ChildItem $kitsBin -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtoolPath) { throw "signtool.exe not found under Windows Kits 10 bin" }

          function Invoke-Signtool {
            param(
              [string[]]$ArgumentList,
              [string]$Label = "signtool",
              [int]$TimeoutSec = 90
            )

            Write-Host "Starting $Label (timeout ${TimeoutSec}s): $($ArgumentList -join ' ')"

            $safeLabel = ($Label -replace '[^A-Za-z0-9_.-]','_')
            $logOut = Join-Path $Env:RUNNER_TEMP "$safeLabel.out.log"
            $logErr = Join-Path $Env:RUNNER_TEMP "$safeLabel.err.log"

            $p = Start-Process -FilePath $signtoolPath -ArgumentList $ArgumentList `
              -RedirectStandardOutput $logOut -RedirectStandardError $logErr `
              -PassThru -WindowStyle Hidden

            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            while (-not $p.HasExited) {
              Start-Sleep -Seconds 5
              if ($sw.Elapsed.TotalSeconds -gt $TimeoutSec) {
                try { $p.Kill() } catch {}
                Write-Host "---- $Label stdout so far ----"
                if (Test-Path $logOut) { Get-Content $logOut | Write-Host }
                Write-Host "---- $Label stderr so far ----"
                if (Test-Path $logErr) { Get-Content $logErr | Write-Host }
                throw "signtool timed out after $TimeoutSec s: $($ArgumentList -join ' ')"
              }
            }

            Write-Host "---- $Label stdout ----"
            if (Test-Path $logOut) { Get-Content $logOut | Write-Host }
            Write-Host "---- $Label stderr ----"
            if (Test-Path $logErr) { Get-Content $logErr | Write-Host }

            if ($p.ExitCode -ne 0) {
              throw "signtool failed (exit $($p.ExitCode)): $($ArgumentList -join ' ')"
            }
          }

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tsServers = @(
            "https://timestamp.digicert.com",
            "https://timestamp.sectigo.com",
            "https://timestamp.globalsign.com/?signature=sha2"
          )

          # NOTE: per SignTool syntax, the file to sign must be LAST in the argument list.
          $signBaseArgs = @(
            "sign",
            "/debug",
            "/fd","sha256",
            "/td","sha256",
            "/a",
            "/f",$pfxPath,
            "/p",$env:PFX_PASS
          )

          $signed = $false
          foreach ($ts in $tsServers) {
            try {
              Invoke-Signtool -ArgumentList ($signBaseArgs + @("/tr",$ts,$msixPath)) -Label "sign_ts_$([Math]::Abs($ts.GetHashCode()))" -TimeoutSec 120
              $signed = $true
              break
            } catch {
              Write-Host "Timestamped signing with $ts failed: $_"
            }
          }

          if (-not $signed) {
            Write-Host "Timestamped signing failed on all servers, retrying without timestamp..."
            Invoke-Signtool -ArgumentList ($signBaseArgs + @($msixPath)) -Label "sign_no_ts" -TimeoutSec 60
          }

          # Verify (can fail in CI if the signing root isn't trusted on the runner; keep it non-fatal but visible)
          try {
            Invoke-Signtool -ArgumentList @("verify","/debug","/pa","/all","/v",$msixPath) -Label "verify" -TimeoutSec 90
          } catch {
            Write-Warning "signtool verify failed (often due to untrusted root in CI). Signed MSIX is still produced. Details: $_"
          }

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Cancel pending Microsoft Store submission (if any)
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:MSSTORE_TENANT_ID) { throw "Missing MSSTORE_TENANT_ID secret" }
          if (-not $env:MSSTORE_CLIENT_ID) { throw "Missing MSSTORE_CLIENT_ID secret" }
          if (-not $env:MSSTORE_CLIENT_SECRET) { throw "Missing MSSTORE_CLIENT_SECRET secret" }
          if (-not $env:MSSTORE_SELLER_ID) { throw "Missing MSSTORE_SELLER_ID secret" }
          if (-not $env:MSSTORE_PRODUCT_ID) { throw "Missing MSSTORE_PRODUCT_ID secret" }

          msstore reconfigure `
            --tenantId $env:MSSTORE_TENANT_ID `
            --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID `
            --clientSecret $env:MSSTORE_CLIENT_SECRET

          $output = & msstore submission delete $env:MSSTORE_PRODUCT_ID --no-confirm 2>&1
          $exitCode = $LASTEXITCODE
          if ($output) { $output | ForEach-Object { Write-Host $_ } }
          if ($exitCode -ne 0) {
            $joined = $output -join "`n"
            if ($joined -match "No pending submission found") {
              Write-Host "No pending submission; continuing."
              exit 0
            } else {
              throw "msstore submission delete failed (exit $exitCode)."
            }
          }

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          MSSTORE_PRODUCT_ID: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:MSSTORE_TENANT_ID) { throw "Missing MSSTORE_TENANT_ID secret" }
          if (-not $env:MSSTORE_CLIENT_ID) { throw "Missing MSSTORE_CLIENT_ID secret" }
          if (-not $env:MSSTORE_CLIENT_SECRET) { throw "Missing MSSTORE_CLIENT_SECRET secret" }
          if (-not $env:MSSTORE_SELLER_ID) { throw "Missing MSSTORE_SELLER_ID secret" }
          if (-not $env:MSSTORE_PRODUCT_ID) { throw "Missing MSSTORE_PRODUCT_ID secret" }

          $msixPath = Join-Path $PWD "TakoWorks.msix"
          if (-not (Test-Path $msixPath)) { throw "MSIX not found: $msixPath" }

          msstore reconfigure `
            --tenantId $env:MSSTORE_TENANT_ID `
            --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID `
            --clientSecret $env:MSSTORE_CLIENT_SECRET

          msstore publish "$msixPath" -id $env:MSSTORE_PRODUCT_ID

      - name: Attach artifact to release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ARTIFACT_NAME }}
            TakoWorks.msix
          fail_on_unmatched_files: true
